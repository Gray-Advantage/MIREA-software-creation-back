name: Tests

on:
  push:
  pull_request:

env:
  POSTGRES_DB: stafftracker
  POSTGRES_USER: stafftracker
  POSTGRES_PASSWORD: stafftracker
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: stafftracker
          POSTGRES_USER: stafftracker
          POSTGRES_PASSWORD: stafftracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stafftracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements/test.txt
      - name: Run migrations
        run: alembic upgrade head
        working-directory: api
      - name: Run tests
        run: python -m pytest -vvvv --ff
