[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D", "CPY", "RUF001", "RUF002", "RUF003", "PLC0415", "SLF001", "ANN401", "EM101",
    "B903", "RUF029", "ERA001",  "TD002", "TD003", "FIX002", "TD004", "COM812", "DOC",
    "TC001", "TC003",
]

[tool.ruff.lint.pylint]
max-args = 5

[tool.ruff.lint.mccabe]
max-complexity = 5
